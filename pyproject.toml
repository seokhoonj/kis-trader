[project]
name = "kis-trader"
version = "0.0.0"
description = "A clean Python client for the Korea Investment & Securities (KIS) Open API (English identifiers, Korean docstrings for KIS users)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# REST(requests) + 실시간 WebSocket(websockets) + 체결통보 AES-CBC 복호화(cryptography).
dependencies = ["requests>=2.31", "websockets>=12", "cryptography>=42"]

[project.scripts]
kis = "kis_trader.cli:main"

[project.optional-dependencies]
# CI(reusable-check.yml)가 `uv pip install -e ".[dev]"` 로 설치해 test/lint/types 를 돌린다.
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[dependency-groups]
docs = ["quartodoc>=0.11", "griffe<2"]  # + quarto CLI(외부 설치)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_trader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# 타입 게이트는 배송되는 패키지 본체(src)만 strict 로 검사한다. 계약을 가진 쪽은 src 이고, 대규모
# legacy 테스트 스위트의 타이핑은 완성도 잔소리(제네릭 인자 누락·의도적 더미 입력·private 접근)가
# 대부분이라 게이트 가치가 낮다 -- 테스트의 행위 회귀는 pytest 가 매 커밋 1700+개를 실제 실행해 잡는다.
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
