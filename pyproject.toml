[project]
name = "kis-openapi"
version = "0.0.0"
description = "A clean Python client for the Korea Investment & Securities (KIS) Open API (English identifiers, Korean docstrings for KIS users)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

# Base install is REST-only. Heavier capabilities are opt-in extras.
[dependency-groups]
test = ["pytest>=8"]
docs = ["quartodoc>=0.11", "griffe<2"]  # + quarto CLI(외부 설치)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_openapi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
