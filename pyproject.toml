[project]
name = "kis-trader"
version = "0.0.0"
description = "A clean Python client for the Korea Investment & Securities (KIS) Open API (English identifiers, Korean docstrings for KIS users)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# REST(requests) + 실시간 WebSocket(websockets) + 체결통보 AES-CBC 복호화(cryptography).
dependencies = ["requests>=2.31", "websockets>=12", "cryptography>=42"]

[project.scripts]
kis = "kis_trader.cli:main"

[project.optional-dependencies]
# CI(reusable-check.yml)가 `uv pip install -e ".[dev]"` 로 설치해 test/lint/types 를 돌린다.
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[dependency-groups]
docs = ["quartodoc>=0.11", "griffe<2"]  # + quarto CLI(외부 설치)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_trader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# 테스트 함수엔 애노테이션 강제를 면제한다(`-> None` 반복은 소음). 패키지 본체는 예외 없이 strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
