name: platform and documentation checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-storage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: macos-latest
            python: .venv/bin/python
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.13 and development dependencies
        run: |
          uv venv --python 3.13
          uv pip install --python "${{ matrix.python }}" -e ".[dev]"
          "${{ matrix.python }}" -c "import sys; assert sys.version_info[:2] == (3, 13); assert sys.version_info.releaselevel == 'final'; print(sys.version, sys.platform)"
      - name: Native Windows directory rename boundaries
        if: runner.os == 'Windows'
        run: |
          "${{ matrix.python }}" - <<'PY'
          """Synthetic-only diagnostic; never releases a child lock to enable rename."""
          import ctypes
          import json
          import msvcrt
          import os
          from pathlib import Path
          import tempfile

          api = ctypes.WinDLL('kernel32', use_last_error=True)
          api.CreateFileW.argtypes = [ctypes.c_wchar_p, ctypes.c_uint32, ctypes.c_uint32, ctypes.c_void_p, ctypes.c_uint32, ctypes.c_uint32, ctypes.c_void_p]
          api.CreateFileW.restype = ctypes.c_void_p
          api.CloseHandle.argtypes = [ctypes.c_void_p]
          api.CloseHandle.restype = ctypes.c_int
          api.SetFileInformationByHandle.argtypes = [ctypes.c_void_p, ctypes.c_int, ctypes.c_void_p, ctypes.c_uint32]
          api.SetFileInformationByHandle.restype = ctypes.c_int
          invalid = ctypes.c_void_p(-1).value
          payload = b'synthetic-lock-payload'


          def open_handle(path, access, flags):
              handle = api.CreateFileW(str(path), access, 7, None, 3, flags, None)
              if handle is None or handle == invalid:
                  raise ctypes.WinError(ctypes.get_last_error())
              return handle


          def rename_handle(source, destination, information_class, flags, source_handle=None):
              # FILE_RENAME_INFO union occupies DWORD, HANDLE is naturally aligned.
              encoded = str(destination).encode('utf-16-le')
              class RenameInfo(ctypes.Structure):
                  _fields_ = [('Flags', ctypes.c_uint32), ('RootDirectory', ctypes.c_void_p),
                              ('FileNameLength', ctypes.c_uint32), ('FileName', ctypes.c_ubyte * len(encoded))]
              information = RenameInfo()
              information.Flags = flags
              information.FileNameLength = len(encoded)
              information.FileName[:] = encoded
              handle = source_handle
              if handle is None:
                  try:
                      handle = open_handle(source, 0x00010000, 0x02200000)
                  except OSError as error:
                      error.probe_stage = 'open_source'
                      raise
              try:
                  if not api.SetFileInformationByHandle(handle, information_class, ctypes.byref(information), ctypes.sizeof(information)):
                      error = ctypes.WinError(ctypes.get_last_error())
                      error.probe_stage = 'rename'
                      raise error
              finally:
                  if source_handle is None:
                      api.CloseHandle(handle)


          def record_error(result, stage, error):
              details = dict(stage=stage, winerror=getattr(error, 'winerror', None), errno=error.errno)
              if stage in ('read_owner', 'read_target'):
                  result['postcheck_failed'] = True
                  result['postcheck_error'] = details
                  return True
              result.update(renamed=False, **details)
              return False


          postcheck_failures = []
          cases = [(child, method, target, False)
                   for child in ('closed', 'shared_raw', 'shared_crt', 'shared_locked')
                   for method in ('os_rename', 'rename_info', 'rename_ex_0', 'rename_ex_posix')
                   for target in ('absent', 'empty', 'nonempty')]
          cases.extend(('shared_locked', method, 'absent', True)
                       for method in ('rename_info', 'rename_ex_0', 'rename_ex_posix'))
          for child_mode, method, target, preopened in cases:
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  source, destination = root / 'source', root / 'destination'
                  source.mkdir()
                  child = source / 'journal.json.lock'
                  child.write_bytes(payload)
                  if target != 'absent':
                      destination.mkdir()
                      if target == 'nonempty':
                          (destination / 'sentinel').write_bytes(b'target-sentinel')
                  raw = descriptor = source_handle = None
                  locked = False
                  result = dict(child=child_mode, method=method, target=target, source_preopened=preopened)
                  stage = 'open_source' if preopened else 'open_child'
                  try:
                      if preopened:
                          try:
                              source_handle = open_handle(source, 0x00010000, 0x02200000)
                          except OSError as error:
                              result.update(renamed=False, stage='open_source', winerror=error.winerror, errno=error.errno)
                              print(json.dumps(result, sort_keys=True), flush=True)
                              continue
                      stage = 'open_child'
                      if child_mode != 'closed':
                          raw = open_handle(child, 0xC0000000, 0x00200080)
                      stage = 'transfer_child'
                      if child_mode in ('shared_crt', 'shared_locked'):
                          descriptor = msvcrt.open_osfhandle(raw, os.O_RDWR | os.O_BINARY)
                          raw = None
                      stage = 'lock_child'
                      if child_mode == 'shared_locked':
                          os.lseek(descriptor, 0, os.SEEK_SET)
                          msvcrt.locking(descriptor, msvcrt.LK_NBLCK, 1)
                          locked = True
                      try:
                          if method == 'os_rename':
                              os.rename(source, destination)
                          else:
                              rename_handle(source, destination, 3 if method == 'rename_info' else 22,
                                            2 if method == 'rename_ex_posix' else 0, source_handle)
                          result['renamed'] = True
                      except OSError as error:
                          result.update(renamed=False, stage=getattr(error, 'probe_stage', 'rename'), winerror=error.winerror, errno=error.errno)
                      stage = 'read_owner'
                      if descriptor is not None:
                          os.lseek(descriptor, 0, os.SEEK_SET)
                          result['owner_bytes_preserved'] = os.read(descriptor, len(payload) + 1) == payload
                      stage = 'read_target'
                      result['source_exists'] = source.exists()
                      result['target_sentinel_preserved'] = target != 'nonempty' or (destination / 'sentinel').read_bytes() == b'target-sentinel'
                      if target != 'absent' and result['renamed']:
                          raise AssertionError('NO-CLOBBER VIOLATION')
                      if not result['target_sentinel_preserved'] or result.get('owner_bytes_preserved') is False:
                          raise AssertionError('BYTE PRESERVATION VIOLATION')
                  except OSError as error:
                      if record_error(result, stage, error):
                          postcheck_failures.append(dict(result))
                  finally:
                      if descriptor is not None:
                          if locked:
                              os.lseek(descriptor, 0, os.SEEK_SET)
                              msvcrt.locking(descriptor, msvcrt.LK_UNLCK, 1)
                          os.close(descriptor)
                      elif raw is not None:
                          api.CloseHandle(raw)
                      if source_handle is not None:
                          api.CloseHandle(source_handle)
                  print(json.dumps(result, sort_keys=True), flush=True)

          if postcheck_failures:
              raise SystemExit('POSTCHECK FAILED: ' + str(len(postcheck_failures)) + ' cases; rename results retained above')
          PY
      - name: Native Windows lock recovery and offline migration
        if: runner.os == 'Windows'
        run: >-
          "${{ matrix.python }}" -m pytest -q
          tests/test_store_dir_fsync.py::test_native_windows_process_exclusion_and_recovery
          tests/test_windows_offline_migration.py
      - name: Native exclusive rename primitives
        run: >-
          "${{ matrix.python }}" -m pytest -q tests/test_order_layout_rename.py
      - name: Portable refusal and root-isolation tests
        run: >-
          "${{ matrix.python }}" -m pytest -q
          tests/test_order_live_findings.py::test_order_store_path_refuses_actual_legacy_directory
          tests/test_order_live_findings.py::test_order_store_rejects_state_inside_cache_cleanup_tree
          tests/test_order_live_findings.py::test_order_layout_rejects_cache_nested_inside_state_without_mutation
          tests/test_order_live_findings.py::test_offline_migration_never_merges_independent_journals
          tests/test_order_live_findings.py::test_offline_constructor_failure_leaves_bytes_and_releases_all_previous_locks
      - name: Native Windows lock handle and rename diagnostics
        if: runner.os == 'Windows'
        run: |
          "${{ matrix.python }}" - <<'PY'
          """Synthetic native probe: no user paths or credential reads."""
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile
          from kis_trader import OrderStore

          assert sys.platform == 'win32', 'native Windows required'
          result = {}
          with tempfile.TemporaryDirectory(prefix='kis-lock-handles-') as temporary:
              source = Path(temporary) / 'source'
              source.mkdir()
              journal = source / 'synthetic.json'
              lock = source / 'synthetic.json.lock'
              lock.write_bytes(b'synthetic-byte-zero')
              with OrderStore(journal, retention_days=0) as held:
                  descriptor = held._process_lock_fd
                  os.lseek(descriptor, 0, os.SEEK_SET)
                  try:
                      result['owner_read_preserves_bytes'] = os.read(descriptor, 4096) == b'synthetic-byte-zero'
                  except OSError as error:
                      result['owner_read_error'] = [type(error).__name__, error.errno, getattr(error, 'winerror', None)]
                  try:
                      lock.read_bytes()
                      result['different_handle_read'] = 'allowed'
                  except OSError as error:
                      result['different_handle_read_error'] = [type(error).__name__, error.errno, getattr(error, 'winerror', None)]
                  try:
                      os.rename(source, Path(temporary) / 'renamed')
                      result['rename_with_owned_lock'] = 'allowed'
                  except OSError as error:
                      result['rename_with_owned_lock_error'] = [type(error).__name__, error.errno, getattr(error, 'winerror', None)]
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Actual native layout and migration boundary
        run: |
          "${{ matrix.python }}" - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          import tempfile
          from kis_trader import Order, OrderStore
          from kis_trader import _order_store_layout as layout
          from kis_trader.errors import KISError, KISUsageError

          assert sys.version_info[:2] == (3, 13)
          assert sys.platform in {'win32', 'darwin'}, 'This job must actually run on the native target'
          windows = sys.platform == 'win32'
          assert layout._requires_legacy_alias() is (not windows)

          def contents(directory):
              # Native Windows byte locks can forbid reading byte zero while held.
              # JSON bytes remain strict; lock size is metadata evidence, not lock-byte proof.
              return {entry.name: ('lock-size', entry.stat().st_size)
                      if entry.name.endswith('.json.lock') else ('json-bytes', entry.read_bytes())
                      for entry in directory.iterdir()}

          with tempfile.TemporaryDirectory(prefix='kis-native-synthetic-') as temporary:
              root = Path(temporary)
              state = root/'fresh-state'/'kis-trader'/'orders'
              cache = root/'fresh-cache'/'kis-trader'/'orders'
              assert layout.ensure_order_store_directory(state, cache) == state
              assert state.is_dir() and not state.is_symlink()
              if windows:
                  assert not os.path.lexists(cache)
              else:
                  assert cache.is_symlink() and cache.samefile(state)
              with OrderStore(state/'synthetic.json', retention_days=0) as journal:
                  journal.try_claim('synthetic-pending', Order.market('005930', side='buy', quantity=1).fingerprint)
              with OrderStore(state/'synthetic.json', retention_days=0) as reopened:
                  assert reopened.is_in_flight('synthetic-pending')
              if windows:
                  layout.migrate_order_store_directory(state, cache, offline=True)
                  assert state.is_dir() and not state.is_symlink()
                  with OrderStore(state/'synthetic.json', retention_days=0) as reopened:
                      assert reopened.is_in_flight('synthetic-pending')

              for case_name, lock_payload in [('empty', b''), ('nonempty', b'synthetic-lock-byte-zero')]:
                  case_root = root/case_name
                  state = case_root/'legacy-state'/'kis-trader'/'orders'
                  cache = case_root/'legacy-cache'/'kis-trader'/'orders'
                  cache.mkdir(parents=True)
                  with OrderStore(cache/'synthetic.json', retention_days=0) as seed:
                      seed.try_claim('synthetic-pending', Order.market('005930', side='buy', quantity=1).fingerprint)
                  lock_path = cache/'synthetic.json.lock'
                  lock_path.write_bytes(lock_payload)  # Closed fixture: include real nonempty byte-zero coverage.
                  closed_lock_bytes = lock_path.read_bytes()
                  with OrderStore(cache/'synthetic.json', retention_days=0) as held:
                      before = contents(cache)
                      try:
                          layout.migrate_order_store_directory(state, cache, offline=True)
                      except KISError:
                          pass
                      else:
                          raise AssertionError('migration ignored a live native source lock')
                      assert contents(cache) == before and not state.exists()
                  assert lock_path.read_bytes() == closed_lock_bytes
                  before = contents(cache)
                  source_identity = (cache.stat().st_dev, cache.stat().st_ino)
                  layout.migrate_order_store_directory(state, cache, offline=True)
                  assert state.is_dir() and not state.is_symlink()
                  assert contents(state) == before
                  backups = list(cache.parent.glob('.orders-backup-*'))
                  assert len(backups) == 1 and contents(backups[0]) == before
                  assert (backups[0].stat().st_dev, backups[0].stat().st_ino) == source_identity
                  assert (state/'synthetic.json.lock').read_bytes() == closed_lock_bytes
                  assert (backups[0]/'synthetic.json.lock').read_bytes() == closed_lock_bytes
                  assert not (state.parent/'.orders-migration.json').exists()
                  if windows:
                      assert not os.path.lexists(cache)
                  else:
                      assert cache.is_symlink() and cache.samefile(state)
                  with OrderStore(state/'synthetic.json', retention_days=0) as reopened:
                      assert reopened.is_in_flight('synthetic-pending')
                  layout.ensure_order_store_directory(state, cache)
                  print('native physical-state migration preserved pending records, backup and lock bytes; payload size', len(lock_payload))

          PY

  browser-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2, official setup action
        with:
          version: '1.5.57'
      - name: Install isolated browser test dependencies
        run: |
          uv venv --python 3.12 .browser-venv
          uv pip install --python .browser-venv/bin/python playwright PyYAML
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Render public documentation
        run: quarto render docs
      - name: Exercise desktop and mobile documentation
        run: |
          .browser-venv/bin/python tools/check_docs_browser.py \
            --site docs/_site --project docs/_quarto.yml \
            --artifacts browser-docs-artifacts
      - name: Upload screenshots and check results for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-desktop-mobile
          path: browser-docs-artifacts
          if-no-files-found: warn
          retention-days: 7
