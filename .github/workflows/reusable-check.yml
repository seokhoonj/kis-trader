name: reusable check

# The full check -- tests, lint, types, and the packaging assertions -- factored
# into one reusable job so both `check.yml` (on push / PR) and the release gate in
# `publish.yml` run the *identical* thing. One definition is what makes "publish
# gates on the full check" true; a second hand-maintained copy would drift, and a
# check added here silently would not gate releases.

on:
  workflow_call:

# The floor lives on the shared body, not only on `check.yml`: `publish.yml`'s gate
# calls this same workflow, and if the floor were only on `check.yml` the gate would
# run this check with the repo-default (possibly write) token. Declared here, the
# check is read-only from every caller. A reusable workflow can only downscope from
# the caller, so this never widens anyone's token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version the unbounded requires-python (>=3.11) actually claims, through
        # the current stable release. 3.11 is the floor that claim has to hold on.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install
        # A venv per matrix version, not `uv pip --system`: the runner's system
        # Python is externally managed and is one fixed version whatever the matrix
        # says. This is also what the docs tell a person to run.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
          .venv/bin/python -c "import sys; print('testing on', sys.version)"

      - name: Test
        run: .venv/bin/pytest -q

      - name: Lint
        run: .venv/bin/ruff check src tests tools/check_docs.py

      - name: Type check
        run: .venv/bin/mypy

      - name: Type check narrowing fixtures
        run: .venv/bin/mypy --strict tests/typing

      - name: Offline documentation contracts
        run: |
          .venv/bin/mypy --strict tools/check_docs.py
          .venv/bin/python -m tools.check_docs --root .

      - name: Confirm the runtime dependencies are exactly the declared three
        # The three-dependency claim is documented in the pyproject comment; a claim
        # nothing checks quietly stops being true. Installed into a bare environment,
        # kis_trader must import with nothing beyond requests, websockets, and
        # cryptography present.
        run: |
          uv venv /tmp/bare --python ${{ matrix.python-version }}
          uv pip install --python /tmp/bare/bin/python .
          /tmp/bare/bin/python -c "
          import re
          import importlib.metadata as md
          requires = md.requires('kis-trader') or []
          runtime = [r for r in requires if 'extra ==' not in r]
          # Extract each requirement's bare name (before any version/marker/extra) and
          # normalize to PEP 503 form; the runtime set must be exactly the declared
          # three, so a fourth dependency slipping in fails here.
          names = sorted(re.split(r'[<>=!~;\[\s]', r, maxsplit=1)[0].replace('_', '-').lower() for r in runtime)
          assert names == ['cryptography', 'requests', 'websockets'], f'unexpected runtime dependencies: {runtime}'
          import kis_trader
          print('kis_trader imports with only the declared runtime dependencies present')
          "
          # The console script runs, and its top-level --version prints (not shoved
          # into a required subcommand).
          /tmp/bare/bin/kis --version

      - name: Confirm a user's type checker can see the hints
        # Every hint in this package is invisible to a user unless py.typed ships
        # alongside it (PEP 561), and the source cannot answer whether it did:
        # src/kis_trader/py.typed can sit in git while the built wheel omits it. So ask
        # it the way a user does -- install the built package into a clean environment
        # and run their checker over their code.
        run: |
          uv venv /tmp/typed --python ${{ matrix.python-version }}
          uv pip install --python /tmp/typed/bin/python . mypy
          cat > /tmp/user_code.py <<'PY'
          from kis_trader import KISClient

          # profile is str | None; an int is neither, so a checker that can see the
          # shipped hints must reject it and name the expected type.
          KISClient(profile=123)
          PY
          # The checker MUST reject the call (a pass would mean it saw no hints); then
          # assert the specific arg-type diagnostic, not just any line containing "str".
          if /tmp/typed/bin/mypy /tmp/user_code.py > /tmp/mypy_out 2>&1; then
            cat /tmp/mypy_out
            echo "mypy accepted KISClient(profile=123) -- shipped hints are not visible"
            exit 1
          fi
          cat /tmp/mypy_out
          grep -Fq 'Argument "profile" to "KISClient" has incompatible type "int"' /tmp/mypy_out
          grep -Fq '[arg-type]' /tmp/mypy_out

      - name: Scan the built artifacts for leaked tooling or local-only paths
        # The sdist is allowlisted and this repo's .gitignore is generic, so the
        # artifacts are clean by construction -- but the backend force-includes files
        # (notably .gitignore) and an allowlist can be loosened later, so gate it: list
        # what the sdist and wheel actually carry and fail on any AI-tooling file,
        # local-only working path (dev/ or refs/), or third-party reference-clone name.
        # One build is enough; run it on the floor version only.
        if: matrix.python-version == '3.11'
        run: |
          uv build
          listing=$( (tar tzf dist/*.tar.gz; unzip -Z1 dist/*.whl) )
          echo "$listing"
          # Path/name scan: AI-tooling files, local-only working dirs, reference-clone names.
          forbidden_path='(^|/)(\.claude|\.codex|\.gemini)/|(^|/)(CLAUDE|GEMINI|AGENTS?)\.md$|(^|/)(dev|refs)/|humbletrader|open-trading-api|python-kis|kis-agent|kis-ai-ext'
          if echo "$listing" | grep -EnI "$forbidden_path"; then
            echo "leak-scan: forbidden path/name in built artifact (see matches above)"
            exit 1
          fi
          # Content scan: a reference-clone name or a credential-shaped literal embedded INSIDE a
          # shipped file's bytes (a docstring, comment, or test fixture). Separate pattern from the
          # path scan -- the path anchors (dev/|refs/|.md$) are meaningless against free text and a
          # bare 'dev' would match /dev/null. Here: third-party names + obvious secret markers.
          forbidden_content='humbletrader|open-trading-api|python-kis|kis-agent|kis-ai-ext|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if tar xzOf dist/*.tar.gz | grep -EnI "$forbidden_content"; then
            echo "leak-scan: forbidden name/secret in shipped file content (see matches above)"
            exit 1
          fi
          echo "leak-scan: artifacts carry no tooling, local-only paths, clone names, or embedded secrets"

      - name: Run every shipped test against the installed wheel
        if: matrix.python-version == '3.11'
        run: |
          artifact_root=$(mktemp -d)
          checkout_root="$PWD"
          wheels=("$PWD"/dist/*.whl)
          archives=("$PWD"/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#archives[@]}" -eq 1
          uv venv "$artifact_root/venv" --python 3.11
          uv pip install --python "$artifact_root/venv/bin/python" "${wheels[0]}[dev]"
          tar -xzf "${archives[0]}" -C "$artifact_root"
          sources=("$artifact_root"/kis_trader-*)
          test "${#sources[@]}" -eq 1
          cd "${sources[0]}"
          env -u PYTHONPATH "$artifact_root/venv/bin/python" - "$checkout_root" <<'PY'
          import sys
          from pathlib import Path
          import kis_trader
          origin = Path(kis_trader.__file__).resolve()
          assert "site-packages" in origin.parts, origin
          assert not origin.is_relative_to(Path.cwd()), origin
          assert not origin.is_relative_to(Path(sys.argv[1]).resolve()), origin
          PY
          env -u PYTHONPATH "$artifact_root/venv/bin/python" -m pytest -q -o pythonpath=.
