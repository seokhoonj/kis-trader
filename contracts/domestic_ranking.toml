method          = "GET"
required_params = ["FID_COND_MRKT_DIV_CODE", "FID_COND_SCR_DIV_CODE", "FID_INPUT_ISCD", "FID_RANK_SORT_CLS_CODE", "FID_INPUT_CNT_1", "FID_PRC_CLS_CODE", "FID_INPUT_PRICE_1", "FID_INPUT_PRICE_2", "FID_VOL_CNT", "FID_TRGT_CLS_CODE", "FID_TRGT_EXLS_CLS_CODE", "FID_DIV_CLS_CODE", "FID_RSFL_RATE1", "FID_RSFL_RATE2"]
optional_params = []
response_fields = []
invariants      = []
