# KIS 국내주식 순위(ranking) 엔드포인트 계약.
# required_params 는 공식 KIS 예제(koreainvestment/open-trading-api,
# examples_llm/domestic_stock/<name>)의 params={...} 딕셔너리에서 독립적으로 뽑은 1차증거다(예제는
# 소문자 fid_* 키를 쓰지만 KIS 와이어/라이브러리는 대문자 FID_* 를 쓰므로 여기선 대문자로 정규화한다).
# 우리 코드는 각 엔드포인트에서 이 필수셋과 같거나 그 상위집합을 전송하므로 정적 contract test
# (tests/test_contracts.py: required_params ⊆ 코드가 보내는 키)는 통과한다.
# 예외 -- finance-ratio/market-value/profit-asset-index 셋은 예제엔 13개 FID 키가 있으나 라이브러리가
# 공유 헬퍼 _fundamentals_params() 안에서 params 를 조립해 정적 추출기(AST)가 fetch 본문에서 키를
# 못 본다(extract_sent_param_keys -> 0 keys). 정적 대조가 불가능하므로 required_params=[] 로 두고
# 각 notes 에 예제 근거를 남긴 뒤 라이브 프로브로 확정한다(param_extract.py 가 명시한 live-probe 경로).

[[endpoint]]
name            = "domestic_ranking_fluctuation"
impl            = "kis_trader.domestic._engine.ranking:fetch_fluctuation"
tr_id           = "FHPST01700000"
