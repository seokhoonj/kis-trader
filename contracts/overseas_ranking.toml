# KIS 해외주식 랭킹 엔드포인트 계약. required_params/response_fields 는 공식 doc 기준.
# 시드는 코드가 이미 필수 파라미터를 보내는 by_change 로 둔다(테스트 green).
[[endpoint]]
name            = "overseas_ranking_change"
impl            = "kis_trader.overseas._engine.ranking:fetch_by_change"
