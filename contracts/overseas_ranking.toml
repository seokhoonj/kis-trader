# KIS 해외주식 순위(ranking) 엔드포인트 계약.
# required_params/response_fields 는 공식 KIS 예제(koreainvestment/open-trading-api,
# examples_llm/overseas_stock/<name>)에서 확인한 1차증거. 우리 코드는 각 엔드포인트에서 이 필수셋의
# 상위집합(+ PRC1/PRC2 또는 빈 KEYB/AUTH)을 전송하므로 정적 contract test 는 통과한다.
# PRC1/PRC2 는 공식 일부 예제에만 있어 optional 로 둔다.
# 라이브↔doc 교훈: by_market_cap(CURR_GB)·by_new_high_low(NDAY)는 US 장중 라이브 재프로브로 필수 확정
# (CURR_GB=0/NDAY=0 -> rt_cd=0, 100 rows). 공식 koreainvestment 예제는 둘 다 누락(stale) -- 벤더 예제가
# 아니라 라이브-장중이 최종 권위. "0" 값은 NAS 로만 검증, 비-US 거래소는 needs-probe(각 notes 참조).

[[endpoint]]
name            = "overseas_ranking_volume"
impl            = "kis_trader.overseas._engine.ranking:fetch_by_volume"
tr_id           = "HHDFS76310010"
path            = "/uapi/overseas-stock/v1/ranking/trade-vol"
method          = "GET"
required_params = ["EXCD", "NDAY", "VOL_RANG", "KEYB", "AUTH", "PRC1", "PRC2"]
optional_params = []
response_fields = []
invariants      = []
source_url      = "https://github.com/koreainvestment/open-trading-api examples_llm/overseas_stock/trade_vol"
notes           = "거래량 순위."

