site_name: kis-trader
site_description: 한국투자증권(KIS) Open API를 위한 깔끔한 파이썬 클라이언트
repo_url: https://github.com/seokhoonj/kis-trader
repo_name: seokhoonj/kis-trader

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로

nav:
  - 홈: index.md
  - 빠른 시작: quickstart.md
  - 국내 (kis.domestic): domestic.md
  - 해외 (kis.overseas): overseas.md
  - 퇴직연금 (kis.pension): pension.md
  - 주문과 안전: orders-and-safety.md
  - API 레퍼런스:
      - 세션·네임스페이스: reference/index.md
      - 종목/계약 핸들: reference/handles.md
      - 주문 안전 타입: reference/safety.md

plugins:
  - search:
      lang: ko
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: table
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
