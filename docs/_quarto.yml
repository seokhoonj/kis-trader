project:
  type: book
  output-dir: _site

lang: ko
number-sections: true
number-depth: 2

book:
  title: "KIS Trader"
  subtitle: '한국투자증권 KIS Open API "비공식" 파이썬 클라이언트'
  favicon: favicon.svg
  repo-url: "https://github.com/seokhoonj/kis-trader"
  repo-subdir: docs   # the Quarto project lives in docs/, so source links need the docs/ prefix
  repo-actions: [source]
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.md
    - taxonomy.md
    - part: "시작하기"
      chapters:
        - quickstart.md
        - appkey.md
        - configuration.md
    - part: "국내 주식"
      chapters:
        - quotes.md
        - financials.md
        - flows.md
        - account.md
        - orders.md
    - part: "시장·검색"
      chapters:
        - screening.md
        - market.md
        - corporate-actions.md
    - part: "해외·연금"
      chapters:
        - overseas.md
        - pension.md
    - part: "다른 상품"
      chapters:
        - etf.md
        - elw.md
        - derivatives.md
        - bonds.md
    - part: "명령줄·에이전트"
      chapters:
        - cli.md
        - claude-skill.md
        - codex-skill.md
        - mcp.md
    - part: "참고"
      chapters:
        - realtime.md
        - limits.md

format:
  html:
    theme: [default, custom.scss]
    highlight-style: atom-one
    syntax-definitions:
      - claude.xml
    include-in-header: _head.html
    toc: true
    toc-depth: 3
    toc-title: "이 페이지"
    code-copy: true
    code-overflow: scroll
    grid:
      sidebar-width: 300px
      body-width: 820px
      margin-width: 260px
