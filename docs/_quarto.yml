project:
  type: book
  output-dir: _site

lang: ko
number-sections: true
number-depth: 2

book:
  title: "KIS Trader"
  subtitle: '한국투자증권 KIS Open API "비공식" 파이썬 클라이언트'
  favicon: favicon.svg
  repo-url: "https://github.com/seokhoonj/kis-trader"
  repo-actions: [source]
  search: true
  sidebar:
    style: docked
  chapters:
    - index.md
    - quickstart.md
    - quotes.md
    - account.md
    - orders.md
    - screening.md
    - market.md
    - overseas.md
    - pension.md
    - realtime.md

format:
  html:
    theme: [default, custom.scss]
    highlight-style: atom-one
    include-in-header: _head.html
    toc: true
    toc-depth: 3
    toc-title: "이 페이지"
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 300px
      body-width: 820px
      margin-width: 260px
